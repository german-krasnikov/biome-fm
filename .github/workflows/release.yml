name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v6
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --extra dev

      - name: Run release preflight
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bash scripts/release.sh --preflight "${TAG_NAME#v}"

      - name: Version sync check
        run: uv run python scripts/sync_versions.py --check

  publish:
    name: GitHub Release
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract changelog section
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import pathlib, re, os
          tag = os.environ['TAG_NAME']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'(## \[{re.escape(tag)}\].*?)(?=\n## |\Z)'
          match = re.search(pattern, text, re.DOTALL)
          body = match.group(1).strip() if match else f'Release {tag}'
          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write('body<<CHANGELOG_EOF\n')
              f.write(body + '\n')
              f.write('CHANGELOG_EOF\n')
          "

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
