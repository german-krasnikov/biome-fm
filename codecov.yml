# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 80%
        if_not_found: success

flag_management:
  default_rules:
    carryforward: true

flags:
  unit:
    paths:
      - src/biome_fm/
    carryforward: true
  integration:
    paths:
      - src/biome_fm/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
