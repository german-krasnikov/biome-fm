[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biome-fm"
version = "0.35.0"
description = "AI-powered cross-platform dual-pane file manager"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "German Krasnikov", email = "german.krasnikov@gmail.com" }]

dependencies = [
    "PySide6>=6.7",
    "fsspec>=2026.6.0",
    "pluggy>=1.4",
    "pygments>=2.14",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "pyfakefs>=5.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ai = [
    "anthropic>=0.30",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]
perf = [
    "scandir-rs>=2.7",
    "xxhash>=3.4",
    "watchfiles>=0.22",
    "blake3>=0.4",
]
glass = [
    "pyqt-liquidglass>=0.1",
]

[project.scripts]
biome-fm = "biome_fm.__main__:main"

[project.entry-points."biome_fm.plugins"]
plastic = "biome_fm.plastic:Plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "--strict-markers -q"
markers = [
    "slow: marks tests as slow",
    "integration: requires real filesystem",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line too long — enforced by formatter, not linter
    "E402",    # module level import not at top
    "E701",    # multiple statements on one line
    "E702",    # multiple statements on one line (semicolon)
    "E731",    # lambda assignment
    "E741",    # ambiguous variable name
    "SIM105",  # contextlib.suppress — not always cleaner
    "SIM102",  # nested if — sometimes reads better split
    "B905",    # zip strict — gradual adoption
    "B904",    # raise from — gradual adoption
    "B008",    # function call in default argument
    "B028",    # stacklevel in warnings
    "RUF001",  # ambiguous unicode — false positives on Cyrillic
    "RUF003",  # ambiguous comment — false positives on Cyrillic
    "RUF005",  # collection literal concatenation
    "RUF012",  # mutable class variable
    "RUF059",  # unpacked variable unused
    "RUF100",  # unused noqa
    "F821",    # undefined name — false positives on TYPE_CHECKING imports
    "SIM103",  # return bool directly — not always clearer
    "SIM222",  # or True — intentional pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.coverage.run]
source = ["src/biome_fm"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
